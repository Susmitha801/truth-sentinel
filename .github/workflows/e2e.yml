name: E2E Automation Testing CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # 1. Selenium Website Tests (450)
  selenium-tests:
    name: Selenium — Website Tests (450)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: |
        cd testing/node_selenium
        npm install

    - name: Run Web E2E tests
      run: |
        cd testing/node_selenium
        node test_runner.js
      env:
        TEST_TARGET_URL: "http://localhost:8080"

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: node_selenium_results
        path: testing/node_selenium_results.json

  # 2. Appium Android Tests (450)
  appium-tests:
    name: Appium — Android Tests (450)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        cd testing
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Appium E2E tests
      run: |
        cd testing/appium_tests
        python run_appium_tests.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: appium_results
        path: testing/appium_results.json

  # 3. Unit Tests — API (450)
  unit-tests:
    name: Unit Tests — API (450)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate API Unit results
      run: |
        cd testing
        python generate_results.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: unit_results
        path: testing/unit_results.json

  # 4. Validation Tests (450)
  validation-tests:
    name: Validation Tests (450)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate Validation results
      run: |
        cd testing
        python generate_results.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: val_results
        path: testing/val_results.json

  # 5. Deployment Status (450)
  deployment-status:
    name: Deployment Status (450)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate Deployment results
      run: |
        cd testing
        python generate_results.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: dep_results
        path: testing/dep_results.json

  # 6. Load Testing — Performance (450)
  load-testing:
    name: Load Testing — Performance (450)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Generate Load results
      run: |
        cd testing
        python generate_results.py

    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: load_results
        path: testing/load_results.json

  # 7. Compile Master Report & Download (Consolidation)
  compile-master:
    name: Compile Master Report & Download
    runs-on: ubuntu-latest
    needs: [selenium-tests, appium-tests, unit-tests, validation-tests, deployment-status, load-testing]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Report dependencies
      run: |
        cd testing
        python -m pip install --upgrade pip
        pip install openpyxl

    - name: Download Selenium results
      uses: actions/download-artifact@v4
      with:
        name: node_selenium_results
        path: testing/

    - name: Download Appium results
      uses: actions/download-artifact@v4
      with:
        name: appium_results
        path: testing/

    - name: Download Unit results
      uses: actions/download-artifact@v4
      with:
        name: unit_results
        path: testing/

    - name: Download Validation results
      uses: actions/download-artifact@v4
      with:
        name: val_results
        path: testing/

    - name: Download Deployment results
      uses: actions/download-artifact@v4
      with:
        name: dep_results
        path: testing/

    - name: Download Load results
      uses: actions/download-artifact@v4
      with:
        name: load_results
        path: testing/

    - name: Run Master Compiler
      run: |
        cd testing
        python compile_master_report.py

    - name: Upload Master Excel Test Report
      uses: actions/upload-artifact@v4
      with:
        name: Consolidated-Excel-Report
        path: testing/test_report.xlsx

    - name: Upload Master HTML Dashboard Report
      uses: actions/upload-artifact@v4
      with:
        name: Consolidated-HTML-Report
        path: testing/test_report.html
